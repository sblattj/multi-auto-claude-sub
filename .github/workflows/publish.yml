# Publish multi-auto-claude-sub to npm on a v* tag, over npm trusted
# publishing (GitHub OIDC). No NPM_TOKEN secret exists or is read.
#
# Prereq: npmjs.com -> package multi-auto-claude-sub -> Settings -> Trusted
# Publisher lists GitHub Actions, repository sblattj/multi-auto-claude-sub,
# workflow publish.yml, no environment. Renaming this file breaks that match.
#
# To (re)publish a tag that is already pushed, dispatch from main:
#   gh workflow run publish.yml -R sblattj/multi-auto-claude-sub -f tag=v0.1.11
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.1.11"
        required: true

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

jobs:
  npm:
    # The tests touch macOS paths (keychain, Claude Code config); run them where they were written.
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - name: Check the tag matches package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      - name: Publish (prepublishOnly runs typecheck, tests and build)
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already on npm; skipping publish"
            exit 0
          fi
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish of $NAME@$VERSION failed. Publishing uses npm trusted publishing: the package's npm settings must list GitHub Actions, repository sblattj/multi-auto-claude-sub, workflow publish.yml, no environment."
            exit 1
          fi
